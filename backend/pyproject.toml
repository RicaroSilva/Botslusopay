[project]
name = "lusopay-botmanager"
version = "0.1.0"
description = "LUSOPAY Bot Manager - backend web (API, regras de disparo, auditoria)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "croniter>=2.0",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
botmanager = "botmanager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botmanager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
