key: atribuir-tarifa-mbway
name: "Atribuir Tarifa MB Way"
description: >
  Identifica clientes sem tarifa MB Way atribuída, gera um ficheiro JSON e
  executa C:\CyclosRESTAPITaskt\CyclosRESTAPITasktConsole.exe para alterar o
  perfil dos clientes no Cyclos. Envia email com sucesso/erros.
category: Cyclos
risk_level: high
source_file: "OK Atribuir Tarifa MB Way.xml"
execution:
  adapter: taskt_cli
  script: "OK Atribuir Tarifa MB Way.xml"
  validated: false
prerequisites:
  - "C:\\CyclosRESTAPITaskt\\CyclosRESTAPITasktConsole.exe instalado (componente auxiliar desconhecido; ver inventário)"
  - "Config.txt com credenciais API e SMTP"
external_effects:
  - "ALTERA o perfil/tarifa de clientes no Cyclos produtivo"
  - "Envia emails internos"
known_limitations:
  - "Uma repetição após falha pode reprocessar clientes; verificar o log C:\\CyclosRESTAPITaskt\\logs antes de repetir"
config_files:
  - "%USERPROFILE%\\Documents\\Ficheiro config robots\\Config.txt"
concurrency:
  policy: single
  exclusive_resources: [taskt-desktop, cyclos-rest-console]
timeout_seconds: 7200
success_detection:
  method: taskt_log
triggers_allowed: [manual, schedule]
requires_approval: true
permissions:
  view: [viewer, operator, approver]
  execute: [operator]
  approve: [approver]
