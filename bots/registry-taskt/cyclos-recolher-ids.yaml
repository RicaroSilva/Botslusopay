# PILOTO (fase 2): primeiro bot real, só leitura na API Cyclos.
key: cyclos-recolher-ids
name: "Recolher Cyclos ID por API"
description: >
  Consulta (GET) a API Cyclos produtiva para obter os IDs dos utilizadores dos
  grupos de penhoras, documentos caducados e envio de fundos. Não escreve dados
  nem envia emails; o resultado fica apenas em memória do taskt.
category: Cyclos
risk_level: low
source_file: "OK recolher Cyclos ID por API.xml"
execution:
  adapter: taskt_cli
  script: "OK recolher Cyclos ID por API.xml"
  expected_sha256: efc46cfc58d834eb5a867db9824f528e08a579794d99c176b29cc64368a97177
  validated: false
prerequisites:
  - "Acesso de rede do servidor de bots a app.lusopay.com:8443"
  - "Credencial API válida (ATENÇÃO: está escrita no próprio XML; ver docs/riscos.md)"
external_effects:
  - "Apenas pedidos GET à API Cyclos produtiva (carga ligeira)"
known_limitations:
  - "O bot não produz ficheiro de saída: o sucesso só é confirmado pelo log do taskt"
  - "A credencial Basic está embutida no XML em vez de vir do Config.txt"
concurrency:
  policy: single
  exclusive_resources: [taskt-desktop]
timeout_seconds: 600
success_detection:
  method: taskt_log
triggers_allowed: [manual, schedule]
requires_approval: false
retry:
  automatic: false
  idempotent: true
permissions:
  view: [viewer, operator, approver]
  execute: [operator]
