key: bcft-mbway-semanal
name: "Análise BCFT MB Way (semanal)"
description: >
  Variante semanal da análise BCFT MB Way: consulta SQL Server, gera relatório,
  envia email e regista transações analisadas no Cyclos.
category: Compliance
risk_level: high
source_file: "OK LUSOPAY Análise BCFT MB Way pagamentos entre pagador e beneficiário SEMANAL.xml"
execution:
  adapter: taskt_cli
  script: "OK LUSOPAY Análise BCFT MB Way pagamentos entre pagador e beneficiário SEMANAL.xml"
  validated: false
prerequisites:
  - "Acesso à base de dados SQL Server"
  - "Config.txt com credenciais API e SMTP"
external_effects:
  - "ESCREVE registos no Cyclos produtivo (POST TransacoesAnalisadas)"
  - "Envio de email"
known_limitations:
  - "Contém 'Prompt for Input': pode bloquear em execução não assistida"
concurrency:
  policy: single
  exclusive_resources: [taskt-desktop]
timeout_seconds: 7200
success_detection:
  method: taskt_log
  taskt_cancelled_is_success: true
triggers_allowed: [manual]
requires_approval: true
permissions:
  view: [viewer, operator, approver]
  execute: [operator]
  approve: [approver]
