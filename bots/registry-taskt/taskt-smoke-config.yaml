# PILOTO (fase 1): teste de fumo do mecanismo de execução taskt.
# Lê apenas o Config.txt para uma variável em memória. Sem rede, sem email, sem escrita.
key: taskt-smoke-config
name: "Teste de execução taskt (lê Config.txt)"
description: >
  Executa o script "OK Recolhe senha API de RPAtaskt.xml", que apenas lê
  Documents\Ficheiro config robots\Config.txt para uma variável. Serve para
  validar o lançamento do taskt pelo worker e a leitura do resultado no log
  do motor, sem efeitos externos.
category: Infraestrutura
risk_level: low
source_file: "OK Recolhe senha API de RPAtaskt.xml"
execution:
  adapter: taskt_cli
  script: "OK Recolhe senha API de RPAtaskt.xml"
  # SHA-256 do ficheiro recebido no ZIP (27-10-2026). Se o ficheiro do servidor for
  # diferente, o worker recusa a execução até a definição ser revista.
  expected_sha256: 7be1a87a69acd6dbdce187a61c626edebd994c4674c2a815df948c4946e411b0
  validated: false
prerequisites:
  - "taskt instalado no servidor de bots e caminho configurado em WORKER_TASKT_EXE"
  - "Ficheiro Documents\\Ficheiro config robots\\Config.txt presente na conta do worker"
external_effects:
  - "Nenhum (só leitura de ficheiro local)"
config_files:
  - "%USERPROFILE%\\Documents\\Ficheiro config robots\\Config.txt"
known_limitations:
  - "Se o Config.txt não existir, o taskt regista erro (Result Code: Error)"
concurrency:
  policy: single
  exclusive_resources: [taskt-desktop]
timeout_seconds: 300
success_detection:
  method: taskt_log
triggers_allowed: [manual]
requires_approval: false
retry:
  automatic: true
  idempotent: true
permissions:
  view: [viewer, operator, approver]
  execute: [operator]
