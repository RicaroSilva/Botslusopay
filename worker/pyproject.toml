[project]
name = "lusopay-worker"
version = "0.1.0"
description = "LUSOPAY Bot Manager - Windows Worker (executa os bots taskt/OpenBots)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lusopay-worker = "lusopay_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lusopay_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
